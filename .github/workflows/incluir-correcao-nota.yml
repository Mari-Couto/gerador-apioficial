name: Incluir correção da nota
on:
  push:
    paths:
      - 'override-note.js'
      - '.github/workflows/incluir-correcao-nota.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Include script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./override-note.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Integra correção da geração da nota' && git push)
