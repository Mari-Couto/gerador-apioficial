name: Fix copy formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-copy:
    if: "!contains(github.event.head_commit.message, 'Fix: copiar nota em texto simples')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir cópia da nota
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "document.getElementById('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(noteOutput.textContent);const b=document.getElementById('copyBtn'),o=b.textContent;b.textContent='✓ NOTA COPIADA';setTimeout(()=>b.textContent=o,1800)}catch{const r=document.createRange();r.selectNodeContents(noteOutput);const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges()}});"
          new = """function buildPlainText(){\nconst cnpj=value('cnpj'),access=selected('access'),sms=selected('sms'),whatsapp=selected('whatsapp'),numberType=selected('numberType'),ura=selected('ura'),facebook=selected('facebook'),bm=selected('bm'),site=selected('site'),siteOwner=selected('siteOwner'),history=selected('history'),calls=selected('calls'),groups=selected('groups'),apiType=selected('apiType'),obs=value('observations');\nconst lines=['Dados da migração para a API Oficial','', '1. DADOS DA EMPRESA',`• CNPJ: ${cnpj}`,'', '2. NÚMERO VINCULADO AO CNPJ',`• Acesso ao número: ${access}`,`• Recebe SMS e ligações: ${sms}`,'', '3. NÚMERO A SER MIGRADO',`• Tipo: ${numberType}`,`• WhatsApp atual: ${whatsapp}`];\nif(numberType==='Fixo')lines.push(`• URA / secretária eletrônica: ${ura}`);\nlines.push('', '4. ESTRUTURA',`• Facebook: ${facebook}`,`• Possui BM: ${bm}`,`• Site: ${site}`);\nif(site==='Não')lines.push(`• Criação do site: ${siteOwner}`);\nlines.push('', '5. PONTOS IMPORTANTES PARA O CLIENTE',`• Histórico de conversas: ${yesNo(history,'Sim, é importante','Não é importante')}`,`• Ligações: ${yesNo(calls,'Sim, são importantes','Não são importantes')}`,`• Grupos de WhatsApp: ${yesNo(groups,'Sim, são importantes','Não são importantes')}`,'', '6. MODALIDADE',`• ${apiType}`);\nif(obs)lines.push('', '7. OBSERVAÇÕES', ...obs.split(/\\r?\\n/).map(line=>`• ${line}`));\nreturn lines.join('\\n');\n}\ndocument.getElementById('copyBtn').addEventListener('click',async()=>{const text=buildPlainText();try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const b=document.getElementById('copyBtn'),o=b.textContent;b.textContent='✓ NOTA COPIADA';setTimeout(()=>b.textContent=o,1800)});"""
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado; nenhuma alteração feita.')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix: copiar nota em texto simples"
          git push
          rm -f .github/workflows/fix-copy.yml
          git add .github/workflows/fix-copy.yml
          git commit -m "Chore: remover workflow temporário"
          git push
