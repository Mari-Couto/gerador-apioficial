name: Fix runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix: runtime etapa 3')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JavaScript runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const form=document.getElementById('apiForm'),generateBtn=document.getElementById('generateBtn'),fixedSection=document.getElementById('fixedSection'),siteOwnerQuestion=document.getElementById('siteOwnerQuestion'),result=document.getElementById('result'),noteOutput=document.getElementById('noteOutput'),errorBox=document.getElementById('errorBox');", "const form=document.getElementById('apiForm'),generateBtn=document.getElementById('generateBtn'),uraQuestion=document.getElementById('uraQuestion'),siteOwnerQuestion=document.getElementById('siteOwnerQuestion'),result=document.getElementById('result'),noteOutput=document.getElementById('noteOutput'),errorBox=document.getElementById('errorBox');")
          s=s.replace("const requiredSections=[1,2,3,5,6,7,8];", "const requiredSections=[1,2,3,4,5,6,7];")
          s=s.replace("function updateConditional(){const fixed=selected('numberType')==='Fixo';fixedSection.classList.toggle('hidden',!fixed);", "function updateConditional(){const fixed=selected('numberType')==='Fixo';uraQuestion.classList.toggle('hidden',!fixed);")
          s=s.replace("function complete(n){if(n===1)return!!value('cnpj');if(n===2)return!!selected('access')&&!!selected('sms');if(n===3)return!!selected('whatsapp')&&!!selected('numberType');if(n===4)return selected('numberType')==='Fixo'?!!selected('ura'):true;if(n===5)return!!selected('facebook')&&!!selected('bm');if(n===6)return!!selected('site')&&(selected('site')!=='Não'||!!selected('siteOwner'));if(n===7)return!!selected('history')&&!!selected('calls')&&!!selected('groups');if(n===8)return!!selected('apiType');return true}", "function complete(n){if(n===1)return!!value('cnpj');if(n===2)return!!selected('access')&&!!selected('sms');if(n===3)return!!selected('whatsapp')&&!!selected('numberType')&&(selected('numberType')!=='Fixo'||!!selected('ura'));if(n===4)return!!selected('facebook')&&!!selected('bm');if(n===5)return!!selected('site')&&(selected('site')!=='Não'||!!selected('siteOwner'));if(n===6)return!!selected('history')&&!!selected('calls')&&!!selected('groups');if(n===7)return!!selected('apiType');return true}")
          s=s.replace("if(n===4&&!selected('numberType'))return;if(n===9)return;", "if(n===8)return;")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix: runtime etapa 3"
          git push
